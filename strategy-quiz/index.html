        function App() {

            const [loaded, setLoaded] = useState(false);
            const [showErr, setShowErr] = useState(false);
            const [submitState, setSubmitState] = useState('idle'); // idle | sending | sent | error
            const submittedRef = useRef(false);
            const topRef = useRef(null);

            useEffect(() => {
                try { const raw = localStorage.getItem(LS_KEY); if (raw) { const d = JSON.parse(raw); setAnswers(d.answers || {}); setStep(typeof d.step === 'number' ? d.step : 0); } } catch (e) {}
                setLoaded(true);
            }, []);
            useEffect(() => { if (loaded) { try { localStorage.setItem(LS_KEY, JSON.stringify({ answers, step })); } catch (e) {} } }, [answers, step, loaded]);
            useEffect(() => { setShowErr(false); if (topRef.current) topRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, [step]);

            // שליחה אוטומטית ל-Google Sheets כשמגיעים לשלב הסיום
            useEffect(() => {
                const isLast = step === SECTIONS.length + 1;
                if (isLast && SHEETS_ENDPOINT && !submittedRef.current) {
                    submittedRef.current = true;
                    setSubmitState('sending');
                    fetch(SHEETS_ENDPOINT, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ts: new Date().toISOString(), data: collectForSubmit(answers) }) })
                        .then(() => setSubmitState('sent'))
                        .catch(() => { submittedRef.current = false; setSubmitState('error'); });
                }
            }, [step]);

            const setAns = (id, val) => setAnswers(a => ({ ...a, [id]: val }));

            const nSections = SECTIONS.length;
            const totalSteps = nSections + 2;
            const isIntro = step === 0;
            const isOutro = step === totalSteps - 1;
            const sectionIdx = step - 1; // valid when 1..nSections
            const section = (!isIntro && !isOutro) ? SECTIONS[sectionIdx] : null;
            const pct = isIntro ? 0 : isOutro ? 100 : Math.round(((sectionIdx + 1) / nSections) * 100);

            const go = (d) => setStep(s => Math.max(0, Math.min(totalSteps - 1, s + d)));
            const restart = () => { if (window.confirm('לאפס את כל התשובות ולהתחיל מחדש?')) { setAnswers({}); setStep(0); setSubmitState('idle'); submittedRef.current = false; try { localStorage.removeItem(LS_KEY); } catch (e) {} } };
            const retrySubmit = () => {
                setSubmitState('sending');
                fetch(SHEETS_ENDPOINT, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ts: new Date().toISOString(), data: collectForSubmit(answers) }) })
                    .then(() => { submittedRef.current = true; setSubmitState('sent'); })
                    .catch(() => setSubmitState('error'));
            };

            const trackKey = (() => { const o = TRACK_OPTIONS.find(x => x.label === answers.bizModel); return o ? o.key : null; })();

            const sectionFields = (() => {
                if (!section) return [];
                if (section.isTrack) return trackKey && TRACKS[trackKey] ? TRACKS[trackKey] : [];
                return section.questions;
            })();
            const sectionHasError = sectionFields.some(q => {
                const val = answers[q.id];
                if (q.req && !String(val || '').trim()) return true;
                return !!validateField(q.t, val);
            });
            const handleNext = () => { if (sectionHasError) { setShowErr(true); return; } go(1); };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header + progress */}
                    <header ref={topRef} className="sticky top-0 z-20 bg-[#080f20]/90 backdrop-blur border-b border-white/10 px-4 py-3">
                        <div className="max-w-2xl mx-auto">
                            <div className="flex items-center justify-between mb-2">
                                <span className="text-slate-400 text-xs">{isIntro ? 'מבוא' : isOutro ? 'סיום' : `${section.part} · שלב ${sectionIdx + 1} מתוך ${nSections}`}</span>
                                <span className="text-slate-500 text-[11px]">נשמר אוטומטית ✓</span>
                            </div>
                            <div className="w-full h-1.5 bg-white/10 rounded-full overflow-hidden">
                                <div className="h-full bg-cta transition-all duration-400 ease-out" style={{ width: `${pct}%` }}></div>
                            </div>
                        </div>
                    </header>

                    <main className="flex-grow px-4 py-8">
                        <div key={step} className="max-w-2xl mx-auto fade-enter fade-enter-active">
                            {isIntro && (
                                <div className="flex flex-col gap-6" style={{ textAlign: 'center' }}>
                                    <h1 className="font-extrabold text-white leading-tight" style={{ fontSize: 'clamp(1.6rem, 6vw, 2.4rem)', textAlign: 'center' }}>{INTRO.title}</h1>
                                    <p className="text-slate-300 leading-relaxed" style={{ textAlign: 'center' }}>{INTRO.sub}</p>
                                    <div className="glass-panel rounded-2xl p-4 text-slate-400 text-sm leading-relaxed" style={{ textAlign: 'center' }}>{INTRO.note}</div>
                                    <button onClick={() => go(1)} className="cta-glow bg-cta text-white font-extrabold text-lg py-4 rounded-full w-full active:scale-95 transition-all" style={{ textAlign: 'center' }}>בוא נתחיל ←</button>
                                    {Object.keys(answers).length > 0 && <button onClick={restart} className="text-white/40 text-xs hover:text-white/70 transition-colors">איפוס והתחלה מחדש</button>}
                                </div>
                            )}

                            {section && (
                                <div className="flex flex-col gap-5">
                                    <div style={{ textAlign: 'right' }}>
                                        <div className="text-highlight font-extrabold text-sm tracking-widest mb-1">{section.part}</div>
                                        <h2 className="font-extrabold text-white leading-tight" style={{ fontSize: 'clamp(1.4rem, 5.5vw, 2rem)', textAlign: 'right' }}>{section.title}</h2>
                                        <p className="text-slate-400 text-sm mt-2 leading-relaxed">{section.purpose}</p>
                                    </div>

                                    {!section.isTrack && section.questions.map(q => (
                                        <QuestionBlock key={q.id} q={q} value={answers[q.id]} onChange={v => setAns(q.id, v)} showErr={showErr} />
                                    ))}

                                    {section.isTrack && (
                                        <>
                                            <div className="glass-panel rounded-2xl p-5">
                                                <label className="block text-white font-semibold text-base md:text-lg mb-3" style={{ textAlign: 'right' }}>מה מתאר הכי טוב את המודל העסקי שלכם?</label>
                                                <Field q={{ t: 'single', o: TRACK_OPTIONS.map(x => x.label) }} value={answers.bizModel} onChange={v => setAns('bizModel', v)} />
                                            </div>
                                            {trackKey && (
                                                <div className="flex flex-col gap-4 fade-enter fade-enter-active">
                                                    <div className="text-slate-400 text-xs border-r-2 border-cta pr-3">שאלות למסלול: {TRACK_OPTIONS.find(x => x.key === trackKey).label}</div>
                                                    {TRACKS[trackKey].map(q => (
                                                        <QuestionBlock key={q.id} q={q} value={answers[q.id]} onChange={v => setAns(q.id, v)} showErr={showErr} />
                                                    ))}
                                                </div>
                                            )}
                                        </>
                                    )}
                                </div>
                            )}

                            {isOutro && (
                                <div className="flex flex-col gap-6 items-center" style={{ textAlign: 'center' }}>
                                    <h1 className="font-extrabold text-white leading-tight" style={{ fontSize: 'clamp(1.6rem, 6vw, 2.4rem)', textAlign: 'center' }}>{OUTRO.title}</h1>
                                    <p className="text-slate-300 leading-relaxed" style={{ textAlign: 'center' }}>{OUTRO.body}</p>
                                    {SHEETS_ENDPOINT && (
                                        <div className="text-sm" style={{ textAlign: 'center' }}>
                                            {submitState === 'sending' && <span className="text-slate-400">שולח את התשובות…</span>}
                                            {submitState === 'sent' && <span className="text-[#4ade80] font-semibold">התשובות נשלחו בהצלחה ✓</span>}
                                            {submitState === 'error' && <span className="text-red-400">לא הצלחנו לשלוח כרגע — התשובות נשמרו במכשיר. <button onClick={retrySubmit} className="underline font-semibold">נסו שוב</button></span>}
                                        </div>
                                    )}
                                    <div className="glass-panel rounded-2xl p-4 text-slate-500 text-xs leading-relaxed" style={{ textAlign: 'center' }}>{OUTRO.disclaimer}</div>
                                    <button onClick={restart} className="text-white/50 text-sm hover:text-white transition-colors">מילוי שאלון חדש</button>
                                </div>
                            )}
                        </div>
                    </main>

                    {/* Nav */}
                    {!isIntro && (
                        <footer className="sticky bottom-0 z-20 bg-[#080f20]/95 backdrop-blur border-t border-white/10 px-4 py-3">
                            <div className="max-w-2xl mx-auto">
                                {showErr && sectionHasError && <div className="mb-2 text-red-400 text-xs font-semibold" style={{ textAlign: 'center' }}>יש להשלים את שדות החובה ולתקן שגיאות כדי להמשיך</div>}
                                <div className="flex items-center gap-3">
                                    <button onClick={() => go(-1)} className="flex-1 py-3.5 rounded-full border-2 border-white/15 text-white/80 font-semibold hover:border-white/30 transition-all" style={{ textAlign: 'center' }}>הקודם</button>
                                    {!isOutro && <button onClick={handleNext} className="flex-[2] cta-glow bg-cta text-white font-extrabold py-3.5 rounded-full active:scale-95 transition-all" style={{ textAlign: 'center' }}>{sectionIdx + 1 === nSections ? 'סיום ←' : 'המשך ←'}</button>}
                                </div>
                            </div>
                        </footer>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
